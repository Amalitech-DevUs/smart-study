[project]
name = "ai-assistant"
version = "0.1.0"
description = "Smart Study AI Assistant - BECE Tutor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=1.6.0",
    "pydantic>=2.5.0",
    "chromadb>=0.4.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]