services:
  - type: web
    name: smart-study-ai
    runtime: python
    rootDir: backend/ai-assistant
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GROQ_API_KEY
        sync: false